name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run automated tests
        run: python -m pytest
      - name: Run inference smoke test
        run: python scripts/smoke_test_inference.py
      - name: Generate aggregate subgroup diagnostics
        run: python scripts/subgroup_audit.py
